server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: 123456

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 开发环境至少使用32字节的HS256密钥，生产环境应通过外部配置注入
    admin-secret-key: sky-take-out-dev-jwt-secret-key-2026-08
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # ===== 以下为用户端（C端）JWT 配置（补全）=====
    # 用户端登录接口 UserController.login 依赖此配置生成 token，缺失将导致空密钥报错
    user-secret-key: sky-take-out-dev-user-secret-key-2026-08
    # 用户端 jwt 过期时间：2小时
    user-ttl: 7200000
    # 用户端请求头中传递的令牌名称
    user-token-name: authentication
