name: Build Windows Desktop Package

# 云端构建「苍穹外卖」桌面版：Maven 打包 → jlink 裁剪运行时 → 组装免安装目录 → 冒烟验证 → 打 zip → 发布 Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（留空则不发布 Release）'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'sky-server/**'
      - 'sky-common/**'
      - 'sky-pojo/**'
      - 'db/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest
    env:
      APP_NAME: SkyTakeOut
      ZIP_NAME: SkyTakeOut-desktop-win64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven package (skip tests)
        run: mvn -B -DskipTests clean package

      - name: Assemble application directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = "dist/$env:APP_NAME"
          New-Item -ItemType Directory -Force -Path "$dist/app" | Out-Null

          $jar = Get-ChildItem "sky-server/target/sky-server-*.jar" |
                 Where-Object { $_.Name -notlike "*.original" } |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $jar) { throw "sky-server executable jar not found" }
          Copy-Item $jar.FullName "$dist/app/sky-take-out.jar"
          Write-Host "Main jar: $($jar.Name) / $([math]::Round($jar.Length/1MB,1)) MB"

          # 内置 Java 运行时（自包含，用户端无需安装 JDK）
          jlink --add-modules ALL-MODULE-PATH --strip-debug --no-header-files --no-man-pages --compress=2 --output "$dist/runtime"
          if (-not (Test-Path "$dist/runtime/bin/java.exe")) { throw "jlink runtime generation failed" }

          # 启动脚本与说明
          Copy-Item "desktop/start.bat" "$dist/start.bat"
          Copy-Item "desktop/start-silent.vbs" "$dist/start-silent.vbs"
          Copy-Item "desktop/README.txt" "$dist/README.txt"

          # 演示图片资源
          New-Item -ItemType Directory -Force -Path "$dist/upload" | Out-Null
          Copy-Item "upload/*" "$dist/upload/" -ErrorAction SilentlyContinue

          Get-ChildItem $dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Smoke test (start server and call APIs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Resolve-Path "dist/$env:APP_NAME"
          $log  = Join-Path $env:GITHUB_WORKSPACE "boot.log"
          $errl = Join-Path $env:GITHUB_WORKSPACE "boot.err.log"

          $proc = Start-Process -FilePath "$dist\runtime\bin\java.exe" `
            -ArgumentList '-Xms128m','-Xmx512m','-Dfile.encoding=UTF-8','-Dspring.profiles.active=desktop','-jar','app\sky-take-out.jar' `
            -WorkingDirectory $dist -PassThru -RedirectStandardOutput $log -RedirectStandardError $errl

          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { break }
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8080/doc.html' -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ready = $true; break }
            } catch { }
          }

          try {
            if (-not $ready) { throw "Server not ready within 120s (process exited: $($proc.HasExited))" }

            $body = '{"username":"admin","password":"123456"}'
            $login = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/admin/employee/login' -Method Post -Body $body -ContentType 'application/json'
            Write-Host "Login: code=$($login.code) msg=$($login.msg)"
            if ($login.code -ne 1) { throw "Admin login failed - H2 schema or seed data problem" }

            $headers = @{ token = $login.data.token }

            $emp = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/admin/employee/page?page=1&pageSize=5' -Headers $headers
            Write-Host "Employee page: total=$($emp.data.total)"

            $cat = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/admin/category/list?type=1' -Headers $headers
            Write-Host "Category list: $($cat.data.Count) rows"

            $shop = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/user/shop/status'
            Write-Host "Shop status: $($shop.data)"

            $ts = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/admin/report/turnoverStatistics?begin=2026-01-01&end=2026-01-03' -Headers $headers
            Write-Host "Turnover statistics: code=$($ts.code)"

            if ($emp.data.total -lt 1) { throw "Seed data missing" }
            Write-Host "SMOKE TEST PASSED"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Start-Sleep -Seconds 2
            Write-Host "----- boot.log (tail) -----"
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            if ((Test-Path $errl) -and (Get-Item $errl).Length -gt 0) {
              Write-Host "----- boot.err.log (tail) -----"
              Get-Content $errl -Tail 40
            }
          }
          if (-not $ready) { exit 1 }

      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path "dist/$env:APP_NAME").Path
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist/$env:ZIP_NAME.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $true, [System.Text.Encoding]::UTF8)
          $f = Get-Item $zip
          Write-Host "Package: $($f.Name) / $([math]::Round($f.Length/1MB,1)) MB"
          "ZIP_SIZE=$([math]::Round($f.Length/1MB,1)) MB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}.zip
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'desktop-v1.0.0' }}
          name: 苍穹外卖 桌面版 v1.0.0
          body: |
            免安装桌面版：解压后双击 `start.bat`（或 `start-silent.vbs` 静默启动），浏览器自动打开 http://localhost:8080

            - 内置 Java 17 运行时，无需安装 JDK
            - 内嵌 H2 文件数据库（MySQL 兼容模式），无需安装 MySQL，首次启动自动建表与写入演示数据
            - 管理端账号 `admin` / `123456`；接口文档 `/doc.html`
            - 数据文件位于 `data\` 目录，删除后重启即可重置
          files: dist/${{ env.ZIP_NAME }}.zip
          fail_on_unmatched_files: true
